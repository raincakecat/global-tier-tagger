plugins { id 'base' }
allprojects { group = 'dev.tiertagger'; version = rootProject.mod_version; repositories { mavenCentral() } }
tasks.register('releaseJars', Copy) {
 dependsOn ':mc12111:build', ':mc2612:build', ':mc262:build', ':mc263:build'
 from project(':mc12111').layout.buildDirectory.dir('libs'), project(':mc2612').layout.buildDirectory.dir('libs'), project(':mc262').layout.buildDirectory.dir('libs'), project(':mc263').layout.buildDirectory.dir('libs')
 include 'global-tier-tagger-*.jar'; exclude '*-sources.jar', '*-dev.jar'; into layout.buildDirectory.dir('release')
}
